services:

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: super_secure_password
      POSTGRES_USER: up_time
      POSTGRES_DB: up_time
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U up_time"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./app
    environment:
      DB_HOST: db
      DB_PASSWORD: super_secure_password
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./app
    command: ["python", "-m", "uptime.worker"]
    environment:
      DB_HOST: db
      DB_PASSWORD: super_secure_password
      LOOP_INTERVAL_SECONDS: "60"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: