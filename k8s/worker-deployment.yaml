apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-worker
  labels:
    app: uptime-monitor
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: uptime-monitor
      component: worker
  template:
    metadata:
      labels:
        app: uptime-monitor
        component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: uptime-monitor:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uptime.worker"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DB_HOST
              value: uptime-db
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uptime-db
                  key: password
            - name: LOOP_INTERVAL_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
